[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musical-time-machine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34",
    "beautifulsoup4>=4.15",
    "ytmusicapi>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[project.scripts]
musical-time-machine = "musical_time_machine.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
