[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musical-time-machine"
version = "0.1.0"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = [
    "requests>=2.34",
    "beautifulsoup4>=4.15",
    "ytmusicapi>=1.12",
]

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/046-scraping-the-billboard"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/046-scraping-the-billboard/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/046-scraping-the-billboard/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "yamllint>=1.38",
]

[project.scripts]
musical-time-machine = "musical_time_machine.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
